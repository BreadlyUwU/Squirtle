[workspace]
resolver = "3"
members = [
    "squirtle-core", "squirtle-d", "squirtle-ctl", "squirtle-pidgey"
]

[workspace.dependencies]
squirtle-core = { path = "squirtle-core" }
squirtle-d = { path = "squirtle-d" }
squirtle-ctl = { path = "squirtle-ctl" }
squirtle-pidgey = { path = "squirtle-pidgey" }
log = "0.4.34"
env_logger = "0.11.11"
libc = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
